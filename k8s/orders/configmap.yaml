# Settings for the orders service, kept outside the image.
# Each key becomes an environment variable in the orders containers
# (see envFrom in deployment.yaml). Values are always strings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: shop
data:
  LOG_LEVEL: "info"
  # The inventory Service name. Cluster DNS turns it into the Service's IP,
  # because orders and inventory are in the same namespace.
  INVENTORY_URL: "http://inventory"
