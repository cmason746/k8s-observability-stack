# Settings for the inventory service. The Redis password is not here:
# it comes from the redis-auth Secret (see deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: shop
data:
  LOG_LEVEL: "info"
  # Sized against the load generator and the 5-minute restock: widget and gadget
  # never run out, gizmo runs out shortly before each delivery (some 409s)
  INITIAL_STOCK: '{"widget": 500, "gadget": 200, "gizmo": 100}'
  REDIS_HOST: "redis"        # The Redis Service name, resolved by cluster DNS
  REDIS_PORT: "6379"
